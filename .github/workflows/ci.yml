name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-spec-change')
        run: node src/scripts/spec-guard.mjs --base origin/${{ github.base_ref }}
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: test-results/
      - run: npm pack --dry-run
