name: dbt compat (latest Fusion)

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compat:
    runs-on: ubuntu-latest
    outputs:
      dbt-version: ${{ steps.dbt.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the latest dbt Fusion
        id: dbt
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "version=$("$HOME/.local/bin/dbt" --version | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build the fixture project on DuckDB through sugar
        working-directory: test/fixtures/project
        env:
          SUGAR_DUCKDB_PATH: ${{ runner.temp }}/sugar_fixture.duckdb
          DBT_SUGAR_HOME: ${{ runner.temp }}/sugar-home
        run: |
          node ../../../src/bin/sugar.js --no-open --port 0 -- dbt build --profiles-dir . &
          SUGAR=$!
          for i in $(seq 1 60); do grep -q '"record_type":"SpanEnd".*Invocation' logs/otel.jsonl 2>/dev/null && break; sleep 2; done
          kill $SUGAR || true
      - name: Check sugar still understands the OTel log
        run: |
          node --input-type=module -e "
          import { createDbtSource, createSnapshotBuilder } from './src/index.js';
          const builder = createSnapshotBuilder({ sources: [createDbtSource({ projectDir: 'test/fixtures/project', env: {} })] });
          const { projects: [p] } = await builder.build();
          const run = p.runs[0];
          console.log(run.version, run.status, run.counts, run.phases.map((x) => x.name));
          if (!p.otel || !run || run.total < 3 || run.counts.success < 3 || !run.phases.some((x) => x.name === 'run')) process.exit(1);
          "

  report-failure:
    needs: compat
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.compat.outputs.dbt-version }}' || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'dbt-compat';
            const title = `dbt-sugar cannot read the OTel log of ${version}`;
            const body = [
              `The monthly compatibility check failed against **${version}**.`,
              '',
              `- Workflow run: ${runUrl}`,
              '',
              'dbt likely changed its OTel event names or attributes. Check `src/dbt/otel.js` against the new release.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body: `Still failing on **${version}**: ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }
